name: Test settings-proxies input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout-enabled: 'false'
          java-version: '21'
          cache-enabled: 'false'
          settings-githubServer: 'false'
          settings-proxies: '[{"id":"http-proxy","active":"true","protocol":"http","host":"proxy.example.com","port":"8080","nonProxyHosts":"localhost|127.0.0.1"}]'
      - name: Assert settings.xml exists
        run: |
          if [ ! -f "$HOME/.m2/settings.xml" ]; then
            echo "FAIL: settings.xml not found at $HOME/.m2/settings.xml"
            exit 1
          fi
          echo "PASS: settings.xml exists"
      - name: Assert proxy in settings.xml
        run: |
          if ! grep -q "proxy.example.com" "$HOME/.m2/settings.xml"; then
            echo "FAIL: proxy host 'proxy.example.com' not found in settings.xml"
            cat "$HOME/.m2/settings.xml"
            exit 1
          fi
          echo "PASS: proxy configuration found in settings.xml"
      - name: Assert Maven is available
        run: |
          mvn --version
          echo "PASS: Maven is available"
