name: Test Maven settings configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          checkout-enabled: 'false'
          java-version: '17'
          java-distribution: 'zulu'
          maven-version: '3.9.6'
          cache-enabled: 'false'
          settings-githubServer: 'false'
          settings-servers: '[{"id": "test-server", "username": "testuser", "password": "testpass"}]'
          settings-mirrors: '[{"id": "test-mirror", "name": "Test Mirror", "mirrorOf": "central", "url": "https://repo1.maven.org/maven2"}]'

      - name: Assert settings.xml exists
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Checking $SETTINGS..."
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists"
          cat "$SETTINGS"

      - name: Assert server configuration in settings.xml
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Checking server configuration..."
          if ! grep -q "test-server" "$SETTINGS"; then
            echo "FAIL: server 'test-server' not found in settings.xml"
            exit 1
          fi
          if ! grep -q "testuser" "$SETTINGS"; then
            echo "FAIL: username 'testuser' not found in settings.xml"
            exit 1
          fi
          echo "PASS: server configuration found in settings.xml"

      - name: Assert mirror configuration in settings.xml
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Checking mirror configuration..."
          if ! grep -q "test-mirror" "$SETTINGS"; then
            echo "FAIL: mirror 'test-mirror' not found in settings.xml"
            exit 1
          fi
          echo "PASS: mirror configuration found in settings.xml"
