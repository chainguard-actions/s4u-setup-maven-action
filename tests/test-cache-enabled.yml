name: Test cache enabled configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          checkout-enabled: 'false'
          java-version: '17'
          java-distribution: 'zulu'
          maven-version: '3.9.6'
          cache-enabled: 'true'
          cache-prefix: 'test-prefix-'
          settings-githubServer: 'false'

      - name: Assert Java is available
        run: |
          java -version
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is installed"

      - name: Assert Maven is available
        run: |
          mvn --version
          MVN_VER=$(mvn --version 2>&1 | head -1)
          echo "maven version output: $MVN_VER"
          if ! echo "$MVN_VER" | grep -q "3.9.6"; then
            echo "FAIL: expected Maven 3.9.6 but got: $MVN_VER"
            exit 1
          fi
          echo "PASS: Maven 3.9.6 is installed"

      - name: Assert Maven local repository directory exists
        run: |
          M2_REPO="$HOME/.m2/repository"
          echo "Checking Maven local repository at $M2_REPO..."
          # The directory may not exist yet if no builds have run, but the parent should
          M2_DIR="$HOME/.m2"
          if [ ! -d "$M2_DIR" ]; then
            echo "FAIL: .m2 directory does not exist at $M2_DIR"
            exit 1
          fi
          echo "PASS: .m2 directory exists"
