name: Test java-jdkFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake JDK archive for input coverage
        run: |
          # Create a minimal placeholder file to pass as java-jdkFile
          # The action will attempt to use it; we use continue-on-error
          mkdir -p /tmp/fake-jdk
          echo "placeholder" > /tmp/fake-jdk/placeholder.txt
          tar -czf /tmp/fake-jdk.tar.gz -C /tmp/fake-jdk .
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout-enabled: 'false'
          java-version: '21'
          java-distribution: 'zulu'
          java-jdkFile: '/tmp/fake-jdk.tar.gz'
          cache-enabled: 'false'
          settings-githubServer: 'false'
      - name: Assert action ran with java-jdkFile input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the fake JDK archive is not a real JDK,
          # but the important thing is the input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with java-jdkFile input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
