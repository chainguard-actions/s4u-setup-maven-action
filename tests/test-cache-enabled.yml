name: Test cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          java-version: '17'
          java-distribution: 'zulu'
          maven-version: '3.9.16'
          cache-enabled: 'true'
          cache-path: '~/.m2/repository'
          checkout-enabled: 'false'

      - name: Assert Maven is installed and functional
        run: |
          MVN_VER=$(mvn --version 2>&1 | head -1)
          echo "maven version: $MVN_VER"
          if ! echo "$MVN_VER" | grep -q "3.9.16"; then
            echo "FAIL: expected Maven 3.9.16 but got: $MVN_VER"
            exit 1
          fi
          echo "PASS: Maven 3.9.16 is installed"

      - name: Assert Java is installed
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is installed"

      - name: Assert Maven local repository directory exists
        run: |
          M2_REPO="$HOME/.m2/repository"
          echo "checking: $M2_REPO"
          # The directory may not exist yet if no packages have been downloaded,
          # but the parent .m2 directory should exist after settings are configured
          M2_DIR="$HOME/.m2"
          if [ ! -d "$M2_DIR" ]; then
            echo "FAIL: .m2 directory not found at $M2_DIR"
            exit 1
          fi
          echo "PASS: .m2 directory exists at $M2_DIR"
