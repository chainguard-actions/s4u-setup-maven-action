name: Test GitHub server settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          java-version: '17'
          java-distribution: 'zulu'
          maven-version: '3.9.16'
          cache-enabled: 'false'
          checkout-enabled: 'false'
          settings-githubServer: 'true'

      - name: Assert settings.xml exists
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "checking: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists"

      - name: Assert GitHub server is configured in settings.xml
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "settings.xml content:"
          cat "$SETTINGS"
          if ! grep -q "github" "$SETTINGS"; then
            echo "FAIL: 'github' server entry not found in settings.xml"
            exit 1
          fi
          echo "PASS: GitHub server entry found in settings.xml"

      - name: Assert Maven can display version (environment is functional)
        run: |
          MVN_VER=$(mvn --version 2>&1)
          echo "maven output: $MVN_VER"
          if ! echo "$MVN_VER" | grep -q "Apache Maven"; then
            echo "FAIL: Maven not functional"
            exit 1
          fi
          echo "PASS: Maven is functional"
