name: Test checkout ssh-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout-enabled: 'true'
          checkout-ssh-key: 'dummy-ssh-key-for-input-coverage'
          checkout-path: 'ssh-checkout-target'
          java-version: '21'
          java-distribution: 'zulu'
          cache-enabled: 'false'
      - name: Assert action ran (ssh-key input was passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the dummy SSH key is invalid,
          # but the important thing is the input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with checkout-ssh-key input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
