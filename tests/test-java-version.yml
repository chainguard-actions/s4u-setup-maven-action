name: Test Java version configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          checkout-enabled: 'false'
          java-version: '11'
          java-distribution: 'temurin'
          maven-version: '3.9.6'
          cache-enabled: 'false'
          settings-githubServer: 'false'

      - name: Assert Java 11 is installed
        run: |
          echo "Checking Java version..."
          java -version
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "11"; then
            echo "FAIL: expected Java 11 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 11 is installed"

      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"

      - name: Assert Maven is available
        run: |
          mvn --version
          echo "PASS: Maven is available"
