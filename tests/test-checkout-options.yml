name: Test checkout options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          checkout-enabled: 'true'
          checkout-fetch-depth: '1'
          checkout-submodules: 'false'
          checkout-lfs: 'false'
          checkout-path: 'checkout-target'
          checkout-ref: 'act-harness'
          java-version: '21'
          java-distribution: 'zulu'
          cache-enabled: 'false'
      - name: Assert checkout path exists
        run: |
          echo "Checking checkout-target directory..."
          if [ ! -d "$GITHUB_WORKSPACE/checkout-target" ]; then
            echo "FAIL: checkout-target directory not found"
            exit 1
          fi
          echo "PASS: checkout-target directory exists"
      - name: Assert Java is set up
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21\|version"; then
            echo "FAIL: Java not set up correctly"
            exit 1
          fi
          echo "PASS: Java is available"
