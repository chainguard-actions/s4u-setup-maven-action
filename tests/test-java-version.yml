name: Test Java version and distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          java-version: '21'
          java-distribution: 'temurin'
          maven-version: '3.9.16'
          cache-enabled: 'false'
          checkout-enabled: 'false'

      - name: Assert Java 21 is installed
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is installed"

      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"

      - name: Assert Maven is installed
        run: |
          MVN_VER=$(mvn --version 2>&1 | head -1)
          echo "maven version: $MVN_VER"
          if ! echo "$MVN_VER" | grep -q "3.9.16"; then
            echo "FAIL: expected Maven 3.9.16 but got: $MVN_VER"
            exit 1
          fi
          echo "PASS: Maven 3.9.16 is installed"
